<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Pump Dashboard - ชั้น 5</title>
    <!-- Tailwind & Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-200 p-4 md:p-8 min-h-screen">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2 mt-4">
            <h1 class="text-3xl font-bold text-white">ระบบควบคุมปั๊มน้ำ (ชั้น 5)</h1>
            <p class="text-sm text-slate-400">อัปเดตระบบล่าสุด: <span id="last-update" class="text-slate-300">-</span></p>
        </div>
        
        <!-- ส่วนแสดงสถานะหลัก และ ข้อมูลรายละเอียด (แบ่ง 2 คอลัมน์) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- การ์ดสถานะปั๊มน้ำ (ซ้าย) -->
            <div id="status-card" class="p-6 rounded-2xl bg-slate-800 border border-slate-700 flex flex-col justify-center items-center text-center transition-all duration-300 min-h-[200px]">
                <div id="status-icon" class="text-6xl mb-3 drop-shadow-md">⚪</div>
                <div id="status-text" class="text-2xl font-bold tracking-wide">กำลังโหลดข้อมูล...</div>
            </div>
            
            <!-- การ์ดรายละเอียดสถานะ (ขวา) -->
            <div class="p-6 rounded-2xl bg-slate-800 border border-slate-700 flex flex-col justify-center space-y-4 text-sm md:text-base">
                <div class="flex justify-between border-b border-slate-700 pb-2">
                    <span class="text-slate-400">สถานะลูกลอย</span>
                    <strong id="float-status" class="text-white">-</strong>
                </div>
                <div class="flex justify-between border-b border-slate-700 pb-2">
                    <span class="text-slate-400">สถานะขา D1 (รีเลย์)</span>
                    <strong id="d1-status" class="text-white">-</strong>
                </div>
                <div class="flex justify-between border-b border-slate-700 pb-2">
                    <span class="text-slate-400">สถานะขา D2 (ลูกลอย)</span>
                    <strong id="d2-status" class="text-white">-</strong>
                </div>
                <div class="flex justify-between border-b border-slate-700 pb-2">
                    <span class="text-slate-400">เวลาทำงานล่าสุด</span>
                    <strong id="last-active" class="text-emerald-400">-</strong>
                </div>
                <div class="flex justify-between pb-1">
                    <span class="text-slate-400">ระยะเวลาล่าสุด (นาที)</span>
                    <strong id="pump-duration" class="text-amber-400 text-lg">0.00</strong>
                </div>
            </div>
        </div>

        <!-- ส่วนของกราฟประวัติการทำงาน -->
        <div class="p-6 rounded-2xl bg-slate-800 border border-slate-700">
            <h2 class="text-lg font-semibold mb-4 text-center text-white">ประวัติการทำงานล่าสุด (นาที)</h2>
            <div class="w-full h-64 md:h-80">
                <canvas id="runTimeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // 1. ตั้งค่า Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDvq7gp9GpQoAwqAR4za3gik0HegDGbg0U",
            authDomain: "water-pump-monitor-e1d75.firebaseapp.com",
            databaseURL: "https://water-pump-monitor-e1d75-default-rtdb.firebaseio.com",
            projectId: "water-pump-monitor-e1d75",
            storageBucket: "water-pump-monitor-e1d75.firebasestorage.app",
            messagingSenderId: "906859161028",
            appId: "1:906859161028:web:dbcd6cd43681255eb3b091",
            measurementId: "G-R4MP7282BT"
        };

        firebase.initializeApp(firebaseConfig);
        
        // อ้างอิงไปที่ root ของ pump เพื่อดึงข้อมูลทั้งหมดมาในครั้งเดียว
        const dbRef = firebase.database().ref('pump');
        let runTimeChart;

        // ฟังก์ชันอัปเดตหรือสร้างกราฟ Chart.js
        function updateChart(durations, stopTimes) {
            if (!durations || !stopTimes) return;
            
            // กรองค่าว่างออกและกลับด้าน Array ให้แสดงเรียงตามเวลา
            const labels = stopTimes.filter(t => t !== null && t !== "").reverse();
            const data = durations.filter((d, i) => stopTimes[i] !== null && stopTimes[i] !== "").reverse();

            if (runTimeChart) {
                runTimeChart.data.labels = labels;
                runTimeChart.data.datasets[0].data = data;
                runTimeChart.update();
            } else {
                const ctx = document.getElementById('runTimeChart').getContext('2d');
                runTimeChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'ระยะเวลาทำงาน (นาที)',
                            data: data,
                            backgroundColor: 'rgba(56, 189, 248, 0.8)', // สีฟ้าสว่าง
                            borderColor: 'rgba(56, 189, 248, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                titleFont: { family: 'Prompt' },
                                bodyFont: { family: 'Prompt' }
                            }
                        },
                        scales: {
                            y: { 
                                beginAtZero: true,
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: '#94a3b8', font: { family: 'Prompt' } }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#94a3b8', font: { family: 'Prompt' } }
                            }
                        }
                    }
                });
            }
        }

        // ดึงข้อมูลแบบ Real-time จาก Firebase
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // 1. อัปเดตสถานะปั๊มหลัก (ซ้าย)
            const card = document.getElementById('status-card');
            const icon = document.getElementById('status-icon');
            const text = document.getElementById('status-text');
            
            if (data.status === "ON" || data.status === true) {
                card.className = "p-6 rounded-2xl bg-emerald-900/40 border border-emerald-500 shadow-[0_0_30px_rgba(16,185,129,0.3)] flex flex-col justify-center items-center text-center transition-all duration-300 min-h-[200px]";
                icon.innerHTML = "🟢";
                text.innerHTML = "ปั๊มทำงาน (ON)";
                text.className = "text-3xl font-bold text-emerald-400 tracking-wide";
            } else {
                card.className = "p-6 rounded-2xl bg-rose-900/40 border border-rose-500 shadow-[0_0_30px_rgba(225,29,72,0.3)] flex flex-col justify-center items-center text-center transition-all duration-300 min-h-[200px]";
                icon.innerHTML = "🔴";
                text.innerHTML = "ปั๊มหยุดทำงาน (OFF)";
                text.className = "text-3xl font-bold text-rose-400 tracking-wide";
            }

            // 2. อัปเดตข้อมูลรายละเอียด (ขวา)
            document.getElementById('last-update').innerText = data.last_updated || "-";
            document.getElementById('last-active').innerText = data.last_active || "-";
            document.getElementById('float-status').innerText = data.floatStatus || "-";
            document.getElementById('d1-status').innerText = data.d1Status || "-";
            document.getElementById('d2-status').innerText = data.d2Status || "-";
            
            // ปัดเศษทศนิยม 2 ตำแหน่ง
            const duration = parseFloat(data.pumpRunDuration || 0).toFixed(2);
            document.getElementById('pump-duration').innerText = duration;

            // 3. วาดกราฟประวัติการทำงาน
            if (data.pumpRunDurations && data.stopHistory) {
                updateChart(data.pumpRunDurations, data.stopHistory);
            }
        });
    </script>
</body>
</html>
